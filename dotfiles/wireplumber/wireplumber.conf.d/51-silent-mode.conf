# Mode silencieux (sway/scripts/silent-mode.sh) : il mute les flux Firefox des onglets
# WhatsApp. Sans cette règle, WirePlumber mémorise ce mute pour *tout* Firefox
# (clé application.name) et la vidéo / visio suivante démarrerait muette.
stream.rules = [
  {
    matches = [ { application.name = "Firefox", media.name = "~.*[Ww]hats[Aa]pp.*" } ]
    actions = { update-props = { state.restore-props = false } }
  }
]
