# tmux.conf des serveurs (fugax, julestoulet…) — à copier en ~/.tmux.conf là-bas.
# Les programmes dans tmux (Claude Code, vim, cpr…) copient via OSC 52 : tmux doit
# la transmettre au terminal du PC local (kitty, à travers ssh ou mosh).
set -s set-clipboard on        # défaut « external » : l'OSC 52 des programmes est ignorée
set -g allow-passthrough on    # séquences \ePtmux;… (passthrough) transmises telles quelles
# tmux émet « ESC]52;;… » (sélection vide) ; mosh ne transmet que « ESC]52;c;… » et jette
# le reste → on force « c », sinon rien n'arrive dans le presse-papier local via mosh.
# « %p1%.0s » consomme le 1er paramètre sans l'afficher : sans lui, ncurses refuse la
# capacité (paramètre inutilisé) et tmux n'émet plus rien du tout, même en ssh.
set -as terminal-overrides ',xterm*:Ms=\E]52;c%p1%.0s;%p2%s\007'

# Molette = scrollback tmux (mosh ne transmet pas l'historique au terminal local).
# Sélection à la souris : glisser → copiée dans le presse-papier local au relâchement.
# Shift+glisser = sélection native de kitty (contourne tmux).
set -g mouse on
set -g history-limit 50000
