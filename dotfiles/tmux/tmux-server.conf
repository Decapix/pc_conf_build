# tmux.conf des serveurs (fugax, julestoulet…) — à copier en ~/.tmux.conf là-bas.
# Les programmes dans tmux (Claude Code, vim, cpr…) copient via OSC 52 : tmux doit
# la transmettre au terminal du PC local (kitty, à travers ssh ou mosh).
set -s set-clipboard on        # défaut « external » : l'OSC 52 des programmes est ignorée
set -g allow-passthrough on    # séquences \ePtmux;… (passthrough) transmises telles quelles
